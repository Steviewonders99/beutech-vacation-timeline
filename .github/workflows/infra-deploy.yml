name: Infrastructure Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      action:
        description: 'Deployment action'
        required: true
        default: 'what-if'
        type: choice
        options:
          - what-if
          - deploy

permissions:
  id-token: write
  contents: read

jobs:
  deploy-infrastructure:
    name: Deploy Infrastructure (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'prod' && 'production' || 'development' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ inputs.environment == 'prod' && secrets.AZURE_CREDENTIALS_PROD || secrets.AZURE_CREDENTIALS_DEV }}

      - name: Create Resource Group (if not exists)
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az group create \
              --name rg-vacationtimeline-${{ inputs.environment }} \
              --location ${{ vars.AZURE_LOCATION || 'eastus' }} \
              --tags environment=${{ inputs.environment }} project=vacation-timeline

      - name: What-If Analysis
        if: inputs.action == 'what-if'
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: rg-vacationtimeline-${{ inputs.environment }}
          template: ./infra/bicep/main.bicep
          parameters: ./infra/config/${{ inputs.environment }}.parameters.json
          additionalArguments: --what-if

      - name: Deploy Infrastructure
        if: inputs.action == 'deploy'
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: rg-vacationtimeline-${{ inputs.environment }}
          template: ./infra/bicep/main.bicep
          parameters: ./infra/config/${{ inputs.environment }}.parameters.json

      - name: Output Deployment Info
        if: inputs.action == 'deploy'
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Resource | Name |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|------|" >> $GITHUB_STEP_SUMMARY
            echo "| Resource Group | rg-vacationtimeline-${{ inputs.environment }} |" >> $GITHUB_STEP_SUMMARY

            # Get Function App URL
            FUNC_URL=$(az functionapp show \
              --name func-vacationtimeline-${{ inputs.environment }} \
              --resource-group rg-vacationtimeline-${{ inputs.environment }} \
              --query defaultHostName \
              --output tsv 2>/dev/null || echo "Not found")
            echo "| Function App URL | https://$FUNC_URL |" >> $GITHUB_STEP_SUMMARY

            # Get Storage Account
            STORAGE=$(az storage account list \
              --resource-group rg-vacationtimeline-${{ inputs.environment }} \
              --query "[0].name" \
              --output tsv 2>/dev/null || echo "Not found")
            echo "| Storage Account | $STORAGE |" >> $GITHUB_STEP_SUMMARY
