<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="vacation-timeline.svg">
    <link rel="shortcut icon" href="vacation-timeline.svg">
    <title>Vacation Timeline - Dark Mode Demo</title>
    <!-- locally stored versions of Staffbase frontend assets -->
    <link href="/css/app.css" rel="stylesheet">
    <link href="/css/libs.css" rel="stylesheet">
    <link href="/css/font.css" rel="stylesheet">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
        padding: 40px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .demo-header {
        text-align: center;
        margin-bottom: 30px;
        color: #f5f5f5;
      }
      .demo-header h1 {
        font-size: 28px;
        font-weight: 600;
        margin-bottom: 8px;
        background: linear-gradient(90deg, #fb923c, #f97316);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .demo-header p {
        font-size: 14px;
        color: #a3a3a3;
      }
      .demo-container {
        max-width: 1200px;
        margin: 0 auto;
        height: 600px;
      }
      .mode-toggle {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-bottom: 24px;
      }
      .mode-toggle a {
        padding: 10px 20px;
        border-radius: 8px;
        text-decoration: none;
        font-size: 13px;
        font-weight: 500;
        transition: all 0.2s;
      }
      .mode-toggle a.light {
        background: #f5f5f5;
        color: #171717;
        border: 1px solid #e5e5e5;
      }
      .mode-toggle a.light:hover {
        background: #ffffff;
      }
      .mode-toggle a.dark {
        background: #fb923c;
        color: #1a1a1a;
        border: 1px solid #fb923c;
      }
      .mode-toggle a.dark:hover {
        background: #f97316;
      }
    </style>
  </head>
  <body>
    <div class="demo-header">
      <h1>Vacation Timeline</h1>
      <p>Enterprise Vacation Management Widget - Dark Mode</p>
    </div>

    <div class="mode-toggle">
      <a href="demo-light.html" class="light">Light Mode</a>
      <a href="demo-dark.html" class="dark">Dark Mode</a>
    </div>

    <div class="demo-container">
      <vacation-timeline dark-mode="true"></vacation-timeline>
    </div>
  </body>
  <script src="bootstrap.js"></script>
  <script src="beutech.vacation-timeline.js"></script>
</html>
