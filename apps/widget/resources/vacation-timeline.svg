<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Vacation Timeline</title>
  <!-- Calendar outline -->
  <rect x="3" y="4" width="18" height="17" rx="2" stroke="#4E79A7" stroke-width="2" fill="#ffffff"/>
  <!-- Calendar top hooks -->
  <path d="M8 2v4M16 2v4" stroke="#4E79A7" stroke-width="2" stroke-linecap="round"/>
  <!-- Horizontal divider -->
  <path d="M3 9h18" stroke="#4E79A7" stroke-width="2"/>
  <!-- Timeline bars (vacation blocks) - colorful like vacations -->
  <rect x="5" y="11" width="6" height="2" rx="1" fill="#4E79A7"/>
  <rect x="13" y="11" width="5" height="2" rx="1" fill="#F28E2B"/>
  <rect x="6" y="15" width="8" height="2" rx="1" fill="#59A14F"/>
  <rect x="16" y="15" width="3" height="2" rx="1" fill="#E15759"/>
</svg>
